name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.7
      - run: bash bundle.sh
      - run: gradle assembleDebug --no-daemon
      - name: Validasi APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - run: >
          gh release create
          v${{ github.run_number }}-${{ github.run_attempt }}
          app/build/outputs/apk/debug/app-debug.apk
          --title "JARVIS v${{ github.run_number }}"
          --notes "Build otomatis"
        env:
          GH_TOKEN: ${{ github.token }}
